version: "3.8"

services:
  chores-backend:
    image: trev125/chores-backend:latest
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/database.sqlite
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
    volumes:
      - chores-data:/app/data
    restart: unless-stopped
    networks:
      - chores-network

  chores-frontend:
    image: trev125/chores-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://YOUR_SERVER_IP_OR_DOMAIN:3001/api
    depends_on:
      - chores-backend
    restart: unless-stopped
    networks:
      - chores-network

volumes:
  chores-data:

networks:
  chores-network:
    driver: bridge
